name: Data Pipeline Continuous Integration

# Trigger this workflow automatically on every git push or pull request to main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Pull down the repository code onto the automated runner server
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    # 2. Provision an official isolated Python environment path
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # 3. Cache pip dependencies to speed up future automated test runs
    - name: Cache Pip Packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    # 4. Install your framework application dependencies
    - name: Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 5. Run your automated test suite using PyTest
    - name: Execute Automated Unit Tests
      run: |
        pytest