name: Data Pipeline Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    # 1. Lock down to ubuntu-24.04 explicitly to clear the migration notice
    runs-on: ubuntu-24.04

    steps:
    # 2. Updated to checkout@v4.2.2 (or checkout@v4 latest tag) to use Node 24 structures
    - name: Checkout Repository Code
      uses: actions/checkout@v4.2.2

    # 3. Updated to setup-python@v5.3.0 (or setup-python@v5 latest tag)
    - name: Set up Python 3.12
      uses: actions/setup-python@v5.3.0
      with:
        python-version: '3.12'

    # 4. Updated to cache@v4.2.0 (or cache@v4 latest tag)
    - name: Cache Pip Packages
      uses: actions/cache@v4.2.0
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --require-hashes -r requirements.lock

    - name: Execute Automated Unit Tests
      run: |
        pytest